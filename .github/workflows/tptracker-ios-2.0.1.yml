name: TPTracker iOS Dusklight 2.0.1
on:
  workflow_dispatch:
  push:
    branches: [codex/ios-2.0.1]
    paths: ['src/**', 'res/**', 'tools/stage_package.py', 'mod.json', 'CMakeLists.txt', '.github/workflows/tptracker-ios-2.0.1.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
      - name: Fetch the exact Dusklight 2.0.1 SDK
        shell: bash
        run: |
          mkdir -p .deps/dusklight
          git -C .deps/dusklight init
          git -C .deps/dusklight remote add origin https://github.com/TwilitRealm/dusklight.git
          git -C .deps/dusklight fetch --depth=1 origin 422d7bb1b6c8d973cccf8b3d0b226a57ac3cc8c7
          git -C .deps/dusklight checkout --detach FETCH_HEAD
          git -C .deps/dusklight submodule update --init --depth=1 -- extern/aurora
      - name: Configure iOS compatibility build
        run: >-
          cmake -S . -B tracker-build -G Ninja
          -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos
          -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO
          -DTPTRACKER_IOS_2_0_1=ON
      - name: Build
        run: cmake --build tracker-build --parallel 3
      - name: Check assets
        run: python3 tests/asset_tests.py
      - uses: actions/upload-artifact@v7
        with:
          name: TPTracker-ios-dusklight-2.0.1
          path: dist/*-ios-dusklight-2.0.1.dusk
          if-no-files-found: error
